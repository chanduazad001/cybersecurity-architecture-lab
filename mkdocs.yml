site_name: Cybersecurity Architecture Lab
site_description: Application, Cloud, and Enterprise Security Architecture
site_author: Chandra Sekhar Merugu
site_url: https://chanduazad001.github.io/cybersecurity-architecture-lab/

repo_name: chanduazad001/cybersecurity-architecture-lab
repo_url: https://github.com/chanduazad001/cybersecurity-architecture-lab
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

extra:
  homepage: https://chanduazad001.github.io/

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md

  - Vulnerability Management:
      - Overview: vulnerability-management/index.md
      - Program & Lifecycle: vulnerability-management/program.md
      - Discovery & Scanning: vulnerability-management/discovery-scanning.md
      - Risk Prioritization: vulnerability-management/risk-prioritization.md
      - Remediation & SLAs: vulnerability-management/remediation-slas.md
      - Metrics & Reporting: vulnerability-management/metrics-reporting.md
      - Decisions: vulnerability-management/decisions.md

  - VM Program Case Study (Sreelaxmi):
      - Charter & Business Case: 00-charter-and-business-case.md
      - Architecture & Process: 01-architecture-and-process.md
      - ADR-0001 Composite Risk Prioritization: adr/ADR-0001-composite-risk-prioritization-model.md
      - ADR-0002 Scanner Selection (Tenable Nessus): adr/ADR-0002-scanner-selection-tenable-nessus.md
      - ADR-0003 ASV Scanning Approach: adr/ADR-0003-external-asv-scanning-approach.md
      - ADR-0004 Multi-Tenant Isolation: adr/ADR-0004-multi-tenant-data-isolation-model.md
